name: Corpus (macOS)

# Cross-checks the crate against Apple's own .sdef files where they live —
# /System/Library/DTDs/sdef.dtd and /System/Library/ScriptingDefinitions/ —
# without redistributing any copyrighted material. The runner image
# ships those paths; we read them in place.
#
# Two independent checks:
#   - tests/dtd_drift.rs: SHA-256 of the live system DTD must match the
#     pinned digest in tests/fixtures/sdef.dtd.sha256, and `xmllint
#     --dtdvalid` must accept every fixture under tests/fixtures/*.sdef.
#   - tests/parses.rs::corpus_smoke (#[ignore]'d on every other CI run):
#     parses every *.sdef under SDEF_FIXTURE_DIR with strict-mode and
#     asserts each succeeds.
#
# Triggers: workflow_dispatch only. macOS minutes on GitHub-hosted runners
# are ~10× the Linux rate, so we deliberately do NOT schedule this or run
# it on every push. The lenient + DTD-drift coverage shipped in ci.yml
# already runs on every PR (self-skipping the macOS-specific bits cleanly).
# Run this manually when:
#   - validating that DTD coverage still matches Apple's live schema
#     (`gh workflow run corpus-macos.yml`),
#   - investigating a `corpus_smoke` failure surfaced locally,
#   - before tagging a release.
#
# The corpus_smoke step also uploads target/corpus_coverage.json — a
# per-fixture map of (element, attribute) names seen — which the conformance
# matrix consumes (see tests/conformance_matrix.rs).

on:
  workflow_dispatch:

concurrency:
  group: corpus-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  corpus:
    name: Corpus + drift (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install libxml2 + pkg-config (Homebrew)
        # tests/common/mod.rs depends on the `libxml` crate, which needs
        # libxml2 + pkg-config to build. macOS ships an older libxml2 in
        # /usr/lib but no .pc file; Homebrew provides both.
        run: |
          brew install libxml2 pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix libxml2)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: ./.github/actions/install-rust-toolchain

      # Shared with ci.yml so an ubuntu fetch warms this macOS run and
      # vice-versa. Registry contents are platform-independent (crates.io
      # metadata + .crate downloads + git checkouts of git-deps).
      - name: Restore cargo registry & git
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-deps-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-deps-

      # target/ is genuinely platform-specific (compiled artifacts by
      # target triple) so this key stays scoped by runner.os.
      - name: Restore target/
        uses: actions/cache/restore@v5
        with:
          path: target
          key: cargo-target-${{ runner.os }}-corpus-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-target-${{ runner.os }}-corpus-${{ hashFiles('**/Cargo.lock') }}-
            cargo-target-${{ runner.os }}-corpus-

      - name: Confirm xmllint is on PATH
        run: xmllint --version

      - name: DTD drift + xmllint validation
        run: cargo test --test dtd_drift -- --nocapture

      - name: Attribute-level conformance (manifest vs live DTD)
        # Self-skips on non-macOS; here on macos-latest the live DTD is
        # present, so this fully exercises the per-element attribute manifest.
        run: cargo test --test attribute_conformance -- --nocapture

      - name: Strict-mode corpus against system + Xcode sdefs
        # Colon-separated paths; missing directories are skipped silently so
        # this stays green even if a runner image drops Xcode.
        env:
          SDEF_FIXTURE_DIR: /System/Library/ScriptingDefinitions:/Applications/Xcode.app/Contents/Resources
        run: cargo test corpus_smoke -- --ignored --nocapture

      - name: Upload corpus coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: corpus-coverage
          path: target/corpus_coverage.json
          if-no-files-found: warn
          retention-days: 30

      - name: Save cargo registry & git
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-deps-${{ hashFiles('**/Cargo.lock') }}

      - name: Save target/
        uses: actions/cache/save@v5
        with:
          path: target
          key: cargo-target-${{ runner.os }}-corpus-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}
