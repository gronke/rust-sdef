[package]
name = "sdef"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Typed parser for Apple .sdef (scripting definition) XML files."
authors = ["Stefan Grönke <stefan@gronke.net>"]
homepage = "https://github.com/gronke/rust-sdef"
license = "MIT"
keywords = ["applescript", "sdef", "macos", "parser", "xml"]
categories = ["parser-implementations", "os::macos-apis"]
# repository = "https://github.com/<owner>/rust-sdef"   # set when published
readme = "README.md"

[dependencies]
quick-xml = { version = "0.40", features = ["serialize", "overlapped-lists"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
# Pure-Rust SHA-256, used by the dtd_drift integration test to compare the
# live `/System/Library/DTDs/sdef.dtd` against the pinned digest in
# `tests/fixtures/sdef.dtd.sha256`.
sha2 = "0.11.0"
