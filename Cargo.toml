[package]
name = "sdef"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Typed parser for Apple .sdef (scripting definition) XML files."
authors = ["Stefan Grönke <stefan@gronke.net>"]
homepage = "https://github.com/gronke/rust-sdef"
repository = "https://github.com/gronke/rust-sdef"
license = "MIT"
keywords = ["applescript", "sdef", "macos", "parser", "xml"]
categories = ["parser-implementations", "os::macos-apis"]
readme = "README.md"
include = [
    "src/**/*.rs",
    "examples/**/*.rs",
    "tests/**/*.rs",
    "tests/fixtures/**",
    "docs/CONFORMANCE.md",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
quick-xml = { version = "0.40", features = ["serialize", "overlapped-lists"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
# Pure-Rust SHA-256, used by the dtd_drift integration test to compare the
# live `/System/Library/DTDs/sdef.dtd` against the pinned digest in
# `tests/fixtures/sdef.dtd.sha256`.
sha2 = "0.11.0"
# TOML loader for tests/fixtures/attribute_manifest.toml, consumed by
# tests/attribute_conformance.rs and tests/conformance_matrix.rs.
toml = "0.8"
# JSON serialization for the corpus coverage artifact emitted by
# tests/parses.rs::corpus_smoke and consumed by tests/conformance_matrix.rs.
serde_json = "1"
# libxml2 bindings, used only by tests/common/mod.rs::parse_dtd for parsing
# the system DTD. The high-level API doesn't expose Dtd walking — we drop
# into `libxml::bindings` for xmlIOParseDTD + xmlHashScan. Build-time deps:
# libxml2 + pkg-config + clang (bindgen). Test-only; the published `sdef`
# crate stays pure-Rust.
libxml = "0.3"
